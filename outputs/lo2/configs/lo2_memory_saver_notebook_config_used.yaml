project:
  name: interpretable_adaptive_tcn_transformer_ae
  seed: 42
  output_dir: /home/danderety/Documents/GitHub/TCN_Transformer_anomaly_analizer/outputs/lo2
data:
  dataset_name: lo2
  raw_dir: /home/danderety/Documents/GitHub/TCN_Transformer_anomaly_analizer/data/raw/lo2
  processed_dir: /home/danderety/Documents/GitHub/TCN_Transformer_anomaly_analizer/data/processed/lo2
  splits_dir: /home/danderety/Documents/GitHub/TCN_Transformer_anomaly_analizer/data/splits/lo2
  max_seq_len: 128
  window_stride: 64
  min_seq_len: 5
  max_runs_per_scenario: 20
  max_lines_per_file: 80
  session_granularity: scenario
  pad_id: 0
  normal_label: 0
  anomaly_label: 1
  test_size: 0.2
  val_size: 0.2
  no_split: true
preprocessing:
  lowercase: false
  remove_timestamps: true
  remove_numbers: false
model:
  vocab_size: 32826
  d_model: 128
  tcn_layers: 4
  transformer_layers: 2
  nhead: 4
  dim_feedforward: 256
  dropout: 0.1
training:
  batch_size: 64
  epochs: 1000
  learning_rate: 0.0003
  weight_decay: 1.0e-05
  gradient_clip: 1.0
  patience: 8
  loss_min_delta: 1.0e-05
  threshold_patience: 9
  threshold_min_delta: 1.0e-06
  threshold_min_relative_delta: 0.01
  threshold_save_loss_tolerance: 0.05
  monitor_detection_metrics: true
  device: cuda
  num_workers: 0
  threshold_monitor_interval: 5
  threshold_resets_patience: false
  detection_min_delta: 0.0001
threshold:
  method: quantile
  selection_policy: raw
  fixed_percentile: 95
  validation_safety_check: false
  target_recall: 0.99
  max_validation_fpr: 0.25
  fbeta_beta: 3.0
  enforce_validation_recall: false
  exact_recall_diagnostics: true
  spot_init_quantile: 98
  spot_risk: 0.0001
  spot_min_excess: 20
  spot_for_models:
  - tcn_transformer_ae_ensemble
  adaptive_window_size: auto
  adaptive_window_fraction: 0.1
  adaptive_window_min: 30
  adaptive_window_max: 200
  adaptive_method: robust_mad
  adaptive_k: 2.0
  adaptive_calibrate_k: true
  adaptive_k_grid:
  - 0.5
  - 1.0
  - 1.5
  - 2.0
  - 2.5
  - 3.0
  - 4.0
  - 5.0
  - 6.0
  - 8.0
  - 10.0
  adaptive_min_scale: 1.0e-06
  adaptive_warmup_trim_percentile: 95
  adaptive_min_window: 20
  update_only_normal: true
multi_scale:
  enabled: true
  lengths:
  - 64
  - 128
  - 256
  aggregation: max
  normalize: robust_z_train
ensemble:
  enabled: true
  member_seeds:
  - 42
  - 43
  - 44
  score_norm: robust_z_train
synthetic_anomalies:
  anomaly_ratio: 0.5
evaluation:
  full_real_evaluation: true
  models:
  - tcn_ae
  - tcn_transformer_ae
  - tcn_transformer_ae_ensemble
  use_synthetic_validation_when_no_anomalies: true
  top_k:
  - 1
  - 3
  - 5
  num_heatmap_examples: 20
  max_localization_samples: 128
xai:
  save_attention_matrices: 0
notebook:
  compact_training_log: true
  compact_training_log_lines: 12
  memory_saver: true
