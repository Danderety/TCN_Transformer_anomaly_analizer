project:
  name: "interpretable_adaptive_tcn_transformer_ae"
  seed: 42
  output_dir: "outputs"

data:
  dataset_name: "demo"
  raw_dir: "data/raw/demo"
  processed_dir: "data/processed/demo"
  splits_dir: "data/splits/demo"
  max_seq_len: 32
  min_seq_len: 5
  pad_id: 0
  normal_label: 0
  anomaly_label: 1
  test_size: 0.20
  val_size: 0.20

preprocessing:
  lowercase: false
  remove_timestamps: true
  remove_numbers: false

model:
  vocab_size: null
  d_model: 16
  tcn_layers: 1
  transformer_layers: 1
  nhead: 4
  dim_feedforward: 32
  dropout: 0.1

training:
  batch_size: 32
  epochs: 2
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_clip: 1.0
  patience: 5
  monitor_detection_metrics: true
  device: "cuda"
  num_workers: 0

threshold:
  method: "quantile"
  fixed_percentile: 95
  validation_safety_check: true
  target_recall: 1.0
  enforce_validation_recall: true
  exact_recall_diagnostics: true
  spot_init_quantile: 98
  spot_risk: 0.0001
  spot_min_excess: 5
  spot_for_models: ["tcn_transformer_ae_ensemble"]
  adaptive_window_size: 200
  adaptive_k: 3.0
  adaptive_min_window: 5
  update_only_normal: true

ensemble:
  enabled: false
  member_seeds: [42, 43]
  score_norm: "robust_z_train"

synthetic_anomalies:
  anomaly_ratio: 0.5

evaluation:
  models: ["tcn_ae", "tcn_transformer_ae"]
  top_k: [1, 3, 5]
  num_heatmap_examples: 20

xai:
  save_attention_matrices: 0
