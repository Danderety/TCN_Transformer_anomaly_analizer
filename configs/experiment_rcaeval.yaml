project:
  name: "interpretable_adaptive_tcn_transformer_ae"
  seed: 42
  output_dir: "outputs"

data:
  dataset_name: "rcaeval"
  raw_dir: "data/raw/rcaeval"
  processed_dir: "data/processed/rcaeval"
  splits_dir: "data/splits/rcaeval"
  max_seq_len: 128
  min_seq_len: 5
  pad_id: 0
  normal_label: 0
  anomaly_label: 1
  test_size: 0.20
  val_size: 0.20

preprocessing:
  lowercase: false
  remove_timestamps: true
  remove_numbers: false

model:
  vocab_size: null
  d_model: 128
  tcn_layers: 4
  transformer_layers: 2
  nhead: 4
  dim_feedforward: 256
  dropout: 0.1

training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_clip: 1.0
  patience: 5
  device: "cuda"
  num_workers: 0

threshold:
  fixed_percentile: 95
  adaptive_window_size: 200
  adaptive_k: 3.0
  adaptive_min_window: 30
  update_only_normal: true

synthetic_anomalies:
  anomaly_ratio: 0.5

evaluation:
  models: ["tcn_ae", "tcn_transformer_ae"]
  top_k: [1, 3, 5]
  num_heatmap_examples: 20
