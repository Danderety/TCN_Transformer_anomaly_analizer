project:
  name: "interpretable_adaptive_tcn_transformer_ae"
  seed: 42
  output_dir: "outputs"

data:
  dataset_name: "rcaeval"
  raw_dir: "data/raw/rcaeval"
  processed_dir: "data/processed/rcaeval"
  splits_dir: "data/splits/rcaeval"
  max_seq_len: 128
  min_seq_len: 5
  max_lines_per_file: 1000
  pad_id: 0
  normal_label: 0
  anomaly_label: 1
  test_size: 0.20
  val_size: 0.20

preprocessing:
  lowercase: false
  remove_timestamps: true
  remove_numbers: false

model:
  vocab_size: null
  d_model: 128
  tcn_layers: 4
  transformer_layers: 2
  nhead: 4
  dim_feedforward: 256
  dropout: 0.1

training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_clip: 1.0
  patience: 8
  loss_min_delta: 0.0
  threshold_patience: 9
  threshold_min_delta: 0.000001
  threshold_min_relative_delta: 0.01
  threshold_save_loss_tolerance: 0.05
  monitor_detection_metrics: true
  device: "cuda"
  num_workers: 0

threshold:
  method: "quantile"
  selection_policy: "recall_fpr_tradeoff"
  fixed_percentile: 95
  validation_safety_check: true
  target_recall: 0.99
  max_validation_fpr: 0.25
  fbeta_beta: 3.0
  enforce_validation_recall: false
  exact_recall_diagnostics: true
  spot_init_quantile: 98
  spot_risk: 0.0001
  spot_min_excess: 20
  spot_for_models: ["tcn_transformer_ae_ensemble"]
  adaptive_window_size: 200
  adaptive_k: 3.0
  adaptive_min_window: 30
  update_only_normal: true

ensemble:
  enabled: true
  member_seeds: [42, 43, 44]
  score_norm: "robust_z_train"

synthetic_anomalies:
  anomaly_ratio: 0.5

evaluation:
  models: ["tcn_ae", "tcn_transformer_ae", "tcn_transformer_ae_ensemble"]
  use_synthetic_validation_when_no_anomalies: true
  top_k: [1, 3, 5]
  num_heatmap_examples: 20

xai:
  save_attention_matrices: 0
